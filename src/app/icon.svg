<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="1.5 1.5 21 21"
  fill="none"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Groundwork"
>
  <title>Groundwork</title>
  <!--
    lucide `list-checks` (ISC — https://lucide.dev). Same icon set the app uses
    throughout, so the browser tab matches the UI.

    Two deliberate deviations from the source, both for favicon duty:

    - stroke-width 2.75 rather than lucide's 2. Lucide is drawn for 24px UI at
      2px; scaled to a 16px tab that lands under 1.4px and greys out. Rendered
      at 16px in both schemes to pick this number, not guessed.
    - viewBox cropped from 0 0 24 24 to the glyph's own bounds (square, still
      centred). Lucide's built-in padding wastes ~2px of a 16px tab.

    Paths below are lucide's, unmodified — so `shadcn`/lucide updates stay
    diffable against upstream.
  -->
  <style>
    svg { --fg: #0a0a0a; }
    @media (prefers-color-scheme: dark) { svg { --fg: #fafafa; } }
    path { stroke: var(--fg); stroke-width: 2.75; }
  </style>

  <path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" />
</svg>
